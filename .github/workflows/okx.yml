name: OKX public market snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/market-trigger.txt'
  schedule:
    - cron: '3-58/5 * * * *'

permissions:
  contents: write

concurrency:
  group: okx-data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline market-risk unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect timestamp-validated OKX official public market
        id: quote
        continue-on-error: true
        run: python scripts/collect.py
      - name: Append daily market archive and audit quote quality
        id: archive
        if: steps.quote.outcome == 'success'
        continue-on-error: true
        run: python scripts/phase1.py snapshot
      - name: Collect official SPCX book, trades and derive risk signals
        id: risk
        if: steps.quote.outcome == 'success' && steps.archive.outcome == 'success'
        continue-on-error: true
        run: python scripts/phase3.py
      - name: Track unique risk events, escalation and two-sample recovery
        id: lifecycle
        if: steps.risk.outcome == 'success'
        continue-on-error: true
        run: python scripts/alert_lifecycle.py
      - name: Publish failure-aware pipeline heartbeat
        if: always()
        env:
          QUOTE_OUTCOME: ${{ steps.quote.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          RISK_OUTCOME: ${{ steps.risk.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: python scripts/pipeline_health.py
      - name: Commit public samples, risk analytics and pipeline heartbeat
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Collect OKX public market and phase3 risk signals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Enforce quote, archive and risk processing success
        if: always()
        run: |
          test "${{ steps.quote.outcome }}" = "success"
          test "${{ steps.archive.outcome }}" = "success"
          test "${{ steps.risk.outcome }}" = "success"
          test "${{ steps.lifecycle.outcome }}" = "success"
