name: SPCX independent data watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/watchdog-trigger.txt'
  schedule:
    - cron: '4,19,34,49 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: spcx-watchdog-writer
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run data freshness and alert lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Audit quote/risk age and actual scheduled-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/watchdog.py
      - name: Publish watchdog outcome and outage transitions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/quality/
          if ! git diff --cached --quiet; then
            git commit -m "Update independent SPCX pipeline watchdog status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
