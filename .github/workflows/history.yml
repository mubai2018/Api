name: OKX phase1 history backfill and instrument specs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (first run full, later incremental), full or incremental'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - full
          - incremental
  push:
    branches: [main]
    paths:
      - 'scripts/phase1.py'
      - 'scripts/audit_phase1.py'
      - '.github/workflows/history.yml'
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: okx-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-slim
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline integrity unit tests
        run: python -m unittest discover -s tests -v
      - id: backfill
        name: Collect OKX historical candles, settled funding and contract specs
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode || 'auto' }}
        run: python scripts/phase1.py backfill "$MODE"
      - id: audit
        name: Independently audit published history and archive completeness
        if: always()
        continue-on-error: true
        run: python scripts/audit_phase1.py
      - name: Preserve archived data and acceptance report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Archive and audit OKX public historical data"
            git push
          fi
      - name: Enforce actual successful backfill and integrity audit
        if: always()
        run: |
          test "${{ steps.backfill.outcome }}" = "success"
          test "${{ steps.audit.outcome }}" = "success"
